<h2>Task List</h2>
<div *ngIf="tasks$ | async as tasks">
<p>Completed tasks: {{ getCompletedTasksCount() }} / {{ tasks.length }}</p>
</div>

<mat-list>
  <!-- PRIMENI ASYNC PIPE -->
  <mat-list-item *ngFor="let task of (tasks$ | async)" (click)="onTaskSelected(task.id)">
    {{ task.title }}
  </mat-list-item>
</mat-list>
